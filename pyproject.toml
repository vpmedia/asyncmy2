[project]
authors = [{ name = "vpmedia", email = "andras@vpmedia.hu" }, { name = "long2ice", email = "long2ice@gmail.com" }]
description = "A fast asyncio MySQL driver"
keywords = ["driver", "asyncio", "mysql"]
license = "Apache-2.0"
name = "asyncmy2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[project.urls]
documentation = "https://github.com/vpmedia/asyncmy2"
homepage = "https://github.com/vpmedia/asyncmy2"
repository = "https://github.com/vpmedia/asyncmy2.git"

[dependency-groups]
dev = [
    "cython",
    "mypy",
    "rich",
    "ruff",
]
test = [
    "aiomysql",
    "cryptography",
    "mysqlclient",
    "pymysql",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-xdist",
    "pytest",
    "rich",
    "uvloop; sys_platform != 'win32' and implementation_name == 'cpython'",
]

[tool.uv]
exclude-newer = "1 days"

[tool.pdm.version]
source = "file"
path = "asyncmy/version.py"

[tool.pdm.build]
run-setuptools = true
custom-hook = "build.py"
includes = ["asyncmy"]

[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend", "setuptools", "wheel", "cython"]

[tool.cibuildwheel]
build-frontend = "pip"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope= "session"
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
markers = []
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
pretty = true
ignore_missing_imports = true
warn_unused_ignores = true
# TODO: Uncomment next line after type hints improved
#check_untyped_defs = true

[tool.pyright]
include = ["asyncmy"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
# Pinned explicitly rather than extending ruff's defaults: 0.16.0 widened the
# default selection well beyond pycodestyle/Pyflakes, which would enable ~17
# extra rule groups here as a side effect of a version bump. Adopt those
# deliberately instead.
select = [
    "E",      # https://docs.astral.sh/ruff/rules/#pycodestyle-e
    "F",      # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "UP",     # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "RUF100", # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
]
ignore = ["UP031", "UP032"] # https://docs.astral.sh/ruff/rules/printf-string-formatting/
